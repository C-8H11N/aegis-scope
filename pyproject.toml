[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisscope"
version = "0.2.0"
description = "Authorization-first SRC security assessment orchestrator with a Windows control plane and constrained Kali runner."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "C-8H11N and AegisScope Contributors" }]
keywords = ["src", "bug-bounty", "security", "orchestration", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
aegisscope = "aegisscope.cli:app"
aegisscope-runner = "aegisscope.runner.cli:main"

[project.urls]
Documentation = "https://github.com/C-8H11N/aegis-scope#readme"
Issues = "https://github.com/C-8H11N/aegis-scope/issues"
Source = "https://github.com/C-8H11N/aegis-scope"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101", "S603", "S607", "UP017"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aegisscope"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
