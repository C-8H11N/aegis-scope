<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AegisScope dashboard preview</title>
  <desc id="desc">A dark authorization-first security control plane with status cards and a policy validator.</desc>
